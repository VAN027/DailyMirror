<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Markdown 同步设置</title>
    <style>
      /*
       * sync.md Plugin Styles
       * UI Kit provides base element styles (body, headings, buttons, inputs, etc.)
       * Only plugin-specific layout and component rules here.
       */

      body {
        padding: var(--s3);
        background: transparent;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }

      .subtitle {
        color: var(--text-color-muted);
        margin-bottom: var(--s3);
      }

      .form-group {
        margin-bottom: var(--s3);
      }

      label {
        display: block;
        font-weight: 500;
        margin-bottom: var(--s-half);
        color: var(--text-color-muted);
      }

      .help-text {
        font-size: 0.85em;
        color: var(--text-color-muted);
        margin-top: var(--s-half);
      }

      .button-group {
        display: flex;
        gap: var(--s);
        margin-top: var(--s3);
      }

      .warning {
        border: 1px solid var(--c-primary);
        border-radius: var(--card-border-radius);
        padding: var(--s-half) var(--s);
        font-weight: bold;
      }

      /* Status messages */
      .status {
        padding: var(--s) var(--s2);
        border-radius: var(--card-border-radius);
        margin-top: var(--s3);
        display: none;
      }

      .status.show {
        display: block;
      }

      .status.info {
        background: color-mix(in srgb, var(--c-primary) 15%, transparent);
        color: var(--c-primary);
        border: 1px solid color-mix(in srgb, var(--c-primary) 30%, transparent);
      }

      .status.success {
        background: color-mix(in srgb, var(--color-success) 15%, transparent);
        color: var(--color-success);
        border: 1px solid color-mix(in srgb, var(--color-success) 30%, transparent);
      }

      .status.error {
        background: color-mix(in srgb, var(--color-danger) 15%, transparent);
        color: var(--color-danger);
        border: 1px solid color-mix(in srgb, var(--color-danger) 30%, transparent);
      }

      /* Loading spinner */
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid var(--divider-color);
        border-top: 2px solid var(--c-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: var(--s);
        vertical-align: middle;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* File path test button */
      .file-path-wrapper {
        position: relative;
      }

      .test-file-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        padding: var(--s-quarter) var(--s);
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>sync.md</h1>
      <p class="subtitle">在 Super Productivity 和 Markdown 文件之间同步任务</p>

      <form id="configForm">
        <div class="form-group">
          <label for="filePath">Markdown 文件路径</label>
          <div class="file-path-wrapper">
            <input
              type="text"
              id="filePath"
              placeholder="/path/to/your/tasks.md"
              style="padding-right: 70px"
            />
            <button
              type="button"
              class="test-file-btn"
              onclick="testFilePath()"
            >
              检查
            </button>
          </div>
          <div class="help-text">要同步的 Markdown 文件的完整路径</div>
        </div>

        <div class="form-group">
          <label for="projectId">项目</label>
          <select id="projectId">
            <option value="">正在加载项目…</option>
          </select>
          <div class="help-text">选择要同步任务的项目</div>
        </div>

        <div class="warning">请注意：此项目的任务数据可能被意外更改或删除！</div>

        <div class="button-group">
          <button
            type="submit"
            class="btn-primary"
            id="saveBtn"
          >
            保存并同步
          </button>
        </div>
      </form>

      <div
        id="status"
        class="status"
      ></div>
    </div>

    <script>
      // State
      let config = null;
      let projects = [];

      // Message handling
      async function sendMessage(message) {
        return new Promise((resolve, reject) => {
          const messageId = Date.now().toString();
          const timeout = setTimeout(() => {
            window.removeEventListener('message', handler);
            reject(new Error('Message timeout'));
          }, 10000);

          const handler = (event) => {
            if (
              event.data?.messageId === messageId ||
              (event.data?.type === 'PLUGIN_MESSAGE_RESPONSE' &&
                event.data?.messageId === messageId)
            ) {
              clearTimeout(timeout);
              window.removeEventListener('message', handler);
              resolve(event.data.response || event.data);
            }
          };

          window.addEventListener('message', handler);

          window.parent.postMessage(
            {
              type: 'PLUGIN_MESSAGE',
              message,
              messageId,
            },
            '*',
          );
        });
      }

      // UI functions
      function showStatus(message, type = 'info') {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = `status ${type} show`;

        if (type !== 'error') {
          setTimeout(() => {
            status.classList.remove('show');
          }, 5000);
        }
      }

      async function loadProjects() {
        try {
          // Try to get projects directly from PluginAPI if available
          if (window.PluginAPI?.getAllProjects) {
            console.log('Loading projects directly from PluginAPI');
            projects = await window.PluginAPI.getAllProjects();
          } else {
            // TODO remove fallback
            console.log('Loading projects via message');
            const response = await sendMessage({ type: 'getProjects' });
            if (response?.success && response.projects) {
              projects = response.projects;
            } else {
              throw new Error('Failed to get projects from background');
            }
          }

          const select = document.getElementById('projectId');
          select.innerHTML = '<option value="">选择项目…</option>';

          if (projects && projects.length > 0) {
            projects.forEach((project) => {
              const option = document.createElement('option');
              option.value = project.id;
              option.textContent = project.title;
              select.appendChild(option);
            });
          } else {
            select.innerHTML = '<option value="">没有找到项目</option>';
          }
        } catch (error) {
          console.error('加载项目失败:', error);
          showStatus('加载项目失败', 'error');

          // Retry after a delay
          setTimeout(() => {
            console.log('Retrying to load projects...');
            loadProjects();
          }, 2000);
        }
      }

      async function loadConfig() {
        try {
          // Request config from background
          const response = await sendMessage({ type: 'getConfig' });
          if (response?.success && response.config) {
            config = response.config;
            document.getElementById('filePath').value = config.filePath || '';
            document.getElementById('projectId').value = config.projectId || '';
          }
        } catch (error) {
          console.error('Failed to load config:', error);
        }
      }

      async function testFilePath() {
        const filePath = document.getElementById('filePath').value;
        if (!filePath) {
          showStatus('请输入文件路径', 'error');
          return;
        }

        // Check if we're in desktop mode first
        if (!window.PluginAPI?.executeNodeScript) {
          showStatus('文件操作仅在桌面版 Super Productivity 中可用', 'error');
          return;
        }

        try {
          const result = await window.PluginAPI.executeNodeScript({
            script: `
              const fs = require('fs');
              const path = require('path');

              try {
                const absolutePath = path.resolve(args[0]);
                if (!fs.existsSync(absolutePath)) {
                  return { success: false, error: '找不到文件' };
                }

                const stats = fs.statSync(absolutePath);
                if (!stats.isFile()) {
                  return { success: false, error: '此路径不是文件' };
                }

                const content = fs.readFileSync(absolutePath, 'utf8');
                const lines = content.split('\\n');
                const taskCount = lines.filter(line => /^\\s*- \\[[ x]\\]/.test(line)).length;

                return {
                  success: true,
                  info: {
                    size: stats.size,
                    modified: stats.mtime,
                    taskCount: taskCount
                  }
                };
              } catch (error) {
                return { success: false, error: error.message };
              }
            `,
            args: [filePath],
            timeout: 5000,
          });

          if (result.success && result.result?.success) {
            const info = result.result.info;
            showStatus(`文件有效，找到 ${info.taskCount} 个任务`, 'success');
          } else {
            showStatus(result.result?.error || '无法访问文件', 'error');
          }
        } catch (error) {
          showStatus('文件检查失败：' + error.message, 'error');
        }
      }

      // Form submission
      document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const filePath = document.getElementById('filePath').value;
        const projectId = document.getElementById('projectId').value;
        const syncDirection = 'bidirectional';

        if (!filePath || !projectId) {
          showStatus('请填写所有必填项', 'error');
          return;
        }

        // Check if we're in desktop mode
        if (!window.PluginAPI?.executeNodeScript) {
          showStatus('Markdown 同步插件需要桌面版 Super Productivity', 'error');
          return;
        }

        const newConfig = {
          filePath,
          projectId,
          syncDirection,
          enabled: true,
        };

        try {
          // Disable save button during operation
          const saveBtn = document.getElementById('saveBtn');
          saveBtn.disabled = true;
          saveBtn.innerHTML = 'Saving<span class="spinner"></span>';

          // Update config in background (which will store it locally)
          const saveResponse = await sendMessage({
            type: 'saveConfig',
            config: newConfig,
          });

          console.log('Save response received:', saveResponse);

          // Check if we have a result field (message response wrapper)
          const actualResponse = saveResponse?.result || saveResponse;

          if (!actualResponse?.success) {
            throw new Error(actualResponse?.error || 'Failed to save config');
          }

          config = newConfig;

          // Trigger sync immediately after saving
          saveBtn.innerHTML = '正在同步<span class="spinner"></span>';
          showStatus('设置已保存，正在开始同步…', 'info');

          try {
            const syncResponse = await sendMessage({ type: 'syncNow' });
            // Don't show error here - the sync is async and will complete later
            // The SYNC_COMPLETED or SYNC_ERROR events will handle the final status
            if (!syncResponse?.success && syncResponse?.error) {
              // Only show error if there's an actual error message (not just missing success)
              showStatus('同步错误：' + syncResponse.error, 'error');
            }
          } catch (error) {
            showStatus('无法启动同步：' + error.message, 'error');
          }

          // Re-enable button
          saveBtn.disabled = false;
          saveBtn.textContent = '保存并同步';
        } catch (error) {
          console.error('Failed to save config:', error);
          showStatus('保存设置失败', 'error');
          // Re-enable button on error
          const saveBtn = document.getElementById('saveBtn');
          saveBtn.disabled = false;
          saveBtn.textContent = '保存并同步';
        }
      });

      // Listen for sync events from background
      window.addEventListener('message', (event) => {
        console.log('UI received message:', event.data);

        if (event.data?.type === 'SYNC_COMPLETED') {
          console.log('Sync completed event received');

          // Show success with sync result details
          if (event.data.result) {
            const result = event.data.result;
            let message = '同步成功';
            if (
              result.tasksAdded > 0 ||
              result.tasksUpdated > 0 ||
              result.tasksDeleted > 0
            ) {
              message += ` - 新增 ${result.tasksAdded} 个，更新 ${result.tasksUpdated} 个，删除 ${result.tasksDeleted} 个`;
            } else {
              message += ' - 无更改';
            }
            showStatus(message, 'success');
          } else {
            showStatus('同步成功', 'success');
          }

          // Re-enable save button if it was disabled
          const saveBtn = document.getElementById('saveBtn');
          if (saveBtn && saveBtn.disabled) {
            saveBtn.disabled = false;
            saveBtn.textContent = '保存并同步';
          }
        } else if (event.data?.type === 'SYNC_ERROR') {
          console.log('Sync error event received:', event.data.error);
          showStatus('同步错误：' + event.data.error, 'error');

          // Re-enable save button on error
          const saveBtn = document.getElementById('saveBtn');
          if (saveBtn && saveBtn.disabled) {
            saveBtn.disabled = false;
            saveBtn.textContent = '保存并同步';
          }
        }
      });

      // Wait for PluginAPI to be available
      async function waitForPluginAPI(maxAttempts = 20) {
        for (let i = 0; i < maxAttempts; i++) {
          if (window.PluginAPI) {
            console.log(`PluginAPI available after ${i} attempts`);
            return true;
          }
          await new Promise((resolve) => setTimeout(resolve, 100));
        }
        console.error('PluginAPI not available after', maxAttempts, 'attempts');
        return false;
      }

      // Initialize
      window.addEventListener('load', async () => {
        // Wait for PluginAPI
        const apiAvailable = await waitForPluginAPI();
        if (!apiAvailable) {
          showStatus('插件接口不可用，请重新加载页面。', 'error');
          return;
        }

        // Check if we're in desktop mode
        if (!window.PluginAPI?.executeNodeScript) {
          showStatus(
            'Markdown 同步插件需要桌面版 Super Productivity，网页版不支持文件同步。',
            'error',
          );
          document.getElementById('configForm').style.opacity = '0.5';
          document.getElementById('configForm').style.pointerEvents = 'none';
          return;
        }

        await loadProjects();
        await loadConfig();
      });
    </script>
  </body>
</html>
