name: DailyMirror iPhone IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Registered devices (release-testing) or App Store export'
        type: choice
        default: release-testing
        options:
          - release-testing
          - app-store-connect

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    environment: dailymirror-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - name: Check signing inputs before building
        env:
          TEAM_ID: ${{ secrets.DAILYMIRROR_APPLE_TEAM_ID }}
          CERTIFICATE: ${{ secrets.DAILYMIRROR_IOS_CERTIFICATE_P12_BASE64 }}
          PASSWORD: ${{ secrets.DAILYMIRROR_IOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.DAILYMIRROR_IOS_APP_PROFILE_BASE64 }}
          SHARE_PROFILE: ${{ secrets.DAILYMIRROR_IOS_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in TEAM_ID CERTIFICATE PASSWORD APP_PROFILE SHARE_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name. Configure the dailymirror-ios environment secrets."
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Import temporary signing identity
        env:
          CERTIFICATE: ${{ secrets.DAILYMIRROR_IOS_CERTIFICATE_P12_BASE64 }}
          PASSWORD: ${{ secrets.DAILYMIRROR_IOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.DAILYMIRROR_IOS_APP_PROFILE_BASE64 }}
          SHARE_PROFILE: ${{ secrets.DAILYMIRROR_IOS_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/dailymirror-signing"
          mkdir -p "$signing_dir"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'dailymirror-signing'
          for env, filename in [('CERTIFICATE', 'distribution.p12'), ('APP_PROFILE', 'app.mobileprovision'), ('SHARE_PROFILE', 'share.mobileprovision')]:
              (directory / filename).write_bytes(base64.b64decode(os.environ[env], validate=True))
          PY
          keychain="$signing_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
      - name: Build and export DailyMirror
        env:
          DAILYMIRROR_APPLE_TEAM_ID: ${{ secrets.DAILYMIRROR_APPLE_TEAM_ID }}
          DAILYMIRROR_IOS_APP_PROFILE: ${{ runner.temp }}/dailymirror-signing/app.mobileprovision
          DAILYMIRROR_IOS_SHARE_PROFILE: ${{ runner.temp }}/dailymirror-signing/share.mobileprovision
          DAILYMIRROR_IOS_EXPORT_METHOD: ${{ inputs.export_method }}
        run: npm run dist:ios:dailymirror
      - name: Save IPA and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DailyMirror-iOS-${{ github.run_number }}
          path: ../releases/ios/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/dailymirror-signing/signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/dailymirror-signing"
