<div class="content">
  <ng-content></ng-content>
</div>
@if (isOpen()) {
  <div
    swipeGesture
    (swiperight)="isTouchActive() && close()"
    [style]="sideStyle()"
    class="side"
    @slideRightPanel
    (@slideRightPanel.start)="isPanelAnimating.set(true)"
    (@slideRightPanel.done)="isPanelAnimating.set(false)"
  >
    <div class="right-panel">
      <!-- Resize Handle -->
      <div
        class="resize-handle"
        (pointerdown)="onResizePointerDown($event)"
        [attr.aria-label]="'调整右侧面板宽度'"
        role="separator"
      ></div>
      <button
        class="edge-close-handle tour-edge-close-handle"
        role="button"
        tabindex="0"
        [attr.aria-label]="'关闭右侧面板，或拖动调整宽度'"
        (pointerdown)="onCloseButtonPointerDown($event)"
        (pointerup)="onCloseButtonPointerUp($event)"
        (keydown.enter)="close()"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>

      <div
        class="side-inner"
        [style.min-width.px]="panelWidth()"
      >
        <right-panel-content></right-panel-content>
      </div>
    </div>
  </div>
}
